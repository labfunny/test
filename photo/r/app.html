<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1, h2 {
            color: #333;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="eventPage" class="hidden">
        <h1>Событие</h1>
        <p id="eventDetails">Подробности о событии загружаются...</p>
    </div>
    <div id="errorPage" class="hidden">
        <h1>Ошибка</h1>
        <p>Событие не найдено. Проверьте правильность ссылки.</p>
    </div>
    <script>
        const tg = window.Telegram.WebApp;

        // Список событий для примера
        const events = {
            "6353034f-f10b-448f-b8f2-864156de588d": "Событие 1: Встреча с командой Telegram.",
            "12345678-1234-1234-1234-123456789abc": "Событие 2: Хакатон по разработке Mini App.",
        };

        // Получение параметра startapp из initData
        const initDataUnsafe = tg.initDataUnsafe;
        const startAppParam = initDataUnsafe.start_param;

        const eventPage = document.getElementById("eventPage");
        const errorPage = document.getElementById("errorPage");
        const eventDetails = document.getElementById("eventDetails");

        // Обработка параметра startapp
        if (startAppParam && events[startAppParam]) {
            eventPage.classList.remove("hidden");
            eventDetails.textContent = events[startAppParam];
        } else {
            errorPage.classList.remove("hidden");
        }
    </script>
</body>
</html>
